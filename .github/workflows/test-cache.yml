name: Test Cache Docker Image

on:
  push:
    branches:
      - test-cache-docker
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
            fetch-depth: 0

      - name: Get Global Tag and Short SHA
        id: vars
        run: |
          git fetch --tags --force
          LATEST_TAG=$(git tag --sort=-creatordate | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v0.0.0"
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker Image
        uses: actions/cache@v4
        with:
            path: /tmp/docker-cache
            key: docker-${{ runner.os }}-${{ steps.vars.outputs.tag }}
            restore-keys: |
              docker-${{ runner.os }}-

      - name: Load or pull Docker Image
        run: |
          if [ -f /tmp/docker-cache/image.tar ]; then
            echo "Loading Docker image from cache..."
            docker load -i /tmp/docker-cache/image.tar
          else
            echo "Pulling Docker image from registry..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
            mkdir -p /tmp/docker-cache
            docker save ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }} -o /tmp/docker-cache/image.tar
          fi

      - name: Test Docker Image
        run: |
          echo "--- Testing Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }} ---"
          docker run --rm --platform linux/amd64 -v ${{ github.workspace }}:/workspace -w /opt/ncs \
            --entrypoint /bin/bash ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }} -c \
            "west build -b nrf52840dk/nrf52840 /workspace/hello_world --pristine"
          echo "Testing completed successfully!"